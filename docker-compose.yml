version: "3.9"

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - app_net

  frontend:
    build:
      context: ./Site_Project_FE
      dockerfile: Dockerfile
    container_name: frontend
    expose:
      - "80"
    networks:
      - app_net

  backend:
    build:
      context: ./Site_Project_BE
      dockerfile: Dockerfile
    container_name: backend
    expose:
      - "8080"
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >
        Server=sqlserver,1433;
        Database=SiteProject;
        User Id=sa;
        Password=YourStrong@Password123;
        TrustServerCertificate=True;
    volumes:
      - ./Site_Project_BE/appsettings.Production.json:/app/appsettings.Production.json:ro
    networks:
      - app_net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong@Password123"
    volumes:
      - sql_data:/var/opt/mssql
    expose:
      - "1433"
    deploy:
      resources:
        limits:
          memory: 7g
          cpus: "2"
    networks:
      - app_net

volumes:
  sql_data:

networks:
  app_net:
